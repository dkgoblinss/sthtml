<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>火影忍者博人传之我是鸣人的邻居 - 状态栏</title>
<link rel="stylesheet" href="https://testingcf.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.2/css/all.min.css">
<script>
(function () {
  var PREFIX = '[火影忍者博人传之我是鸣人的邻居]';

  var css = [
    ':root{--c-primary:#F48FB1;--c-secondary:#B388FF;--c-accent:#FF1744}',
    '*{margin:0;padding:0;box-sizing:border-box}',
    'body{font-family:"PingFang SC","Microsoft YaHei","Sarasa Gothic SC",sans-serif;font-size:14px;color:#F5EDEF;line-height:1.5;background:transparent}',
    '.status-bar-container{display:flex;flex-direction:column;gap:10px;width:100%;min-width:560px;padding:12px;background:#26191E;border-radius:12px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 8px 16px rgba(0,0,0,0.5);animation:fade-in 0.4s ease-out}',
    '.header-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 12px;background:#3A2A30;border-radius:8px;border:1px solid rgba(255,255,255,0.1)}',
    '.header-title{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;color:#F5EDEF}',
    '.header-title i{font-size:17px;color:#F48FB1}',
    '.header-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}',
    '.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:12px;color:#C9B9BE;background:#2E2126;border:1px solid rgba(255,255,255,0.1)}',
    '.chip i{font-size:12px}',
    '.chip-home{color:#FF1744;border-color:#C4001D;animation:pulse-danger 2.5s ease-in-out infinite}',
    '.chip-demo{color:#FFC107;border-color:#FFC107}',
    '.panel{display:flex;flex-direction:column;gap:10px;padding:12px;background:#2E2126;border-radius:8px;border:1px solid rgba(255,255,255,0.1)}',
    '.panel-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:#F5EDEF}',
    '.panel-title i{font-size:16px;color:#F48FB1}',
    '.stats-grid{display:flex;flex-direction:column;gap:12px}',
    '.stat-bar{display:flex;flex-direction:column;gap:6px}',
    '.stat-header{display:flex;justify-content:space-between;align-items:center}',
    '.stat-label{display:flex;align-items:center;gap:6px;font-size:14px;color:#C9B9BE}',
    '.stat-label i{font-size:16px}',
    '.stat-value{font-size:14px;font-weight:600;color:#F5EDEF}',
    '.stat-progress-bg{height:24px;background:#26191E;border-radius:12px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);position:relative}',
    '.stat-progress-fill{height:100%;border-radius:12px;transition:width 0.8s ease-out;position:relative;overflow:hidden}',
    '.stat-progress-fill::after{content:"";position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.3),transparent);animation:shimmer 2s infinite}',
    '.type-affection{background:linear-gradient(90deg,#D66D8F,#F8BBD0);box-shadow:0 0 10px rgba(244,143,177,0.3)}',
    '.type-obedience{background:linear-gradient(90deg,#5C9CE6,#9CC8F5);box-shadow:0 0 8px rgba(92,156,230,0.3)}',
    '.type-corruption{background:linear-gradient(90deg,#8E5FD3,#FF1744);box-shadow:0 0 12px rgba(255,23,68,0.4)}',
    '.icon-heart{color:#F48FB1;animation:heart-beat 1.5s ease-in-out infinite}',
    '.icon-hand{color:#5C9CE6}',
    '.icon-fire{color:#B388FF}',
    '.stage-progress{padding:16px 12px;background:#2E2126;border-radius:8px;border:1px solid rgba(255,255,255,0.1)}',
    '.stage-dots{display:flex;justify-content:space-between;align-items:center;position:relative}',
    '.stage-dots::before{content:"";position:absolute;top:12px;left:5%;right:5%;height:2px;background:rgba(255,255,255,0.1);z-index:0}',
    '.stage-dot{display:flex;flex-direction:column;align-items:center;gap:6px;z-index:1;position:relative}',
    '.dot-inner{width:24px;height:24px;border-radius:50%;border:2px solid;transition:all 0.4s ease;background:#26191E}',
    '.dot-label{font-size:11px;color:#99868C;white-space:nowrap;transition:all 0.3s ease}',
    '.stage-dot.future .dot-inner{border-color:rgba(255,255,255,0.1);background:#26191E}',
    '.stage-dot.future .dot-label{color:#99868C}',
    '.stage-dot.completed .dot-inner{border-color:#F48FB1;background:#F48FB1}',
    '.stage-dot.completed .dot-label{color:#F48FB1;font-weight:500}',
    '.stage-dot.current .dot-inner{border-color:#FF1744;background:#FF1744;box-shadow:0 0 15px rgba(255,23,68,0.4);animation:pulse-glow 2s ease-in-out infinite}',
    '.stage-dot.current .dot-label{color:#FF1744;font-weight:600}',
    '.cycle-indicator{display:flex;flex-direction:column;gap:6px;padding:12px;background:#2E2126;border-radius:8px;border:1px solid rgba(255,255,255,0.1);transition:all 0.3s ease}',
    '.cycle-indicator.ovulation{border-color:#FF5252;background:rgba(255,82,82,0.1)}',
    '.cycle-header{display:flex;justify-content:space-between;align-items:center}',
    '.cycle-label{display:flex;align-items:center;gap:6px;font-size:14px;color:#C9B9BE}',
    '.cycle-label i{font-size:16px}',
    '.cycle-indicator.ovulation .cycle-label i{color:#FF5252;animation:breathe 2s ease-in-out infinite}',
    '.cycle-indicator:not(.ovulation) .cycle-label i{color:#66BB6A}',
    '.cycle-status{display:flex;align-items:center;gap:8px}',
    '.status-badge{padding:2px 8px;border-radius:8px;font-size:12px;font-weight:500;background:#66BB6A;color:white}',
    '.status-badge.ovulation{background:#FF5252;animation:pulse-danger 2s ease-in-out infinite}',
    '.cycle-day{font-size:12px;color:#99868C}',
    '.cycle-progress-bg{height:8px;background:#26191E;border-radius:4px;overflow:hidden}',
    '.cycle-progress-fill{height:100%;background:#66BB6A;border-radius:4px;transition:width 0.5s ease-out}',
    '.cycle-progress-fill.ovulation{background:#FF5252;box-shadow:0 0 8px rgba(255,82,82,0.5)}',
    '@keyframes pulse-glow{0%,100%{box-shadow:0 0 10px rgba(244,143,177,0.3)}50%{box-shadow:0 0 20px rgba(244,143,177,0.3),0 0 30px rgba(244,143,177,0.3)}}',
    '@keyframes pulse-danger{0%,100%{box-shadow:0 0 8px rgba(255,23,68,0.4)}50%{box-shadow:0 0 18px rgba(255,23,68,0.4),0 0 26px rgba(255,23,68,0.4)}}',
    '@keyframes breathe{0%,100%{opacity:0.6}50%{opacity:1}}',
    '@keyframes heart-beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}',
    '@keyframes fade-in{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}',
    '@keyframes shimmer{0%{left:-100%}100%{left:100%}}',
    '@media (max-width:800px){.status-bar-container{min-width:unset;padding:8px;gap:8px}.stage-dots{flex-wrap:wrap;gap:12px}.stage-dots::before{display:none}.dot-label{font-size:10px}.stat-progress-bg{height:20px}}'
  ].join('');

  document.head.appendChild(Object.assign(document.createElement('style'), { textContent: css }));
  console.info(PREFIX + ' 样式注入完成');

  var Z = (typeof z !== 'undefined' && z && z.z) ? z.z : z;
  var Schema = Z.object({
    世界: Z.object({
      日期: Z.coerce.number().transform(function (v) { return _.clamp(Math.round(v), 1, 36500); }),
      时间段: Z.enum(['早晨', '上午', '下午', '傍晚', '夜晚']),
      位置: Z.enum(['鸣人家', '邻居家', '街道与商业区', '火影楼', '温泉澡堂', '忍者学校', '其他']),
      鸣人状态: Z.enum(['在家', '不在家'])
    }),
    雏田: Z.object({
      好感度: Z.coerce.number().transform(function (v) { return _.clamp(v, 0, 100); }),
      顺从度: Z.coerce.number().transform(function (v) { return _.clamp(v, 0, 100); }),
      堕落度: Z.coerce.number().transform(function (v) { return _.clamp(v, 0, 100); }),
      关系阶段: Z.enum(['普通', '动摇并越界', '沉沦', '受精怀孕']),
      生理日程: Z.enum(['安全日', '排卵日'])
    })
  }).prefault({
    世界: { 日期: 1, 时间段: '上午', 位置: '邻居家', 鸣人状态: '不在家' },
    雏田: { 好感度: 40, 顺从度: 20, 堕落度: 10, 关系阶段: '普通', 生理日程: '安全日' }
  });

  var readData = function () {
    try {
      var raw = (typeof getVariables === 'function') ? getVariables({ type: 'message', message_id: getCurrentMessageId() }) : null;
      var stat = raw ? _.get(raw, 'stat_data') : undefined;
      if (stat === undefined) { return null; }
      var r = Schema.safeParse(stat);
      return r.success ? r.data : null;
    } catch (e) {
      return null;
    }
  };

  var first = readData();
  var hasReal = Vue.ref(first !== null);
  var dataRef = Vue.ref(first || Schema.parse(undefined));
  var timer = setInterval(function () {
    var d = readData();
    if (d) {
      if (!hasReal.value) { hasReal.value = true; }
      if (!_.isEqual(dataRef.value, d)) { dataRef.value = d; }
    }
  }, 2000);
  window.addEventListener('pagehide', function () { clearInterval(timer); });
  console.info(PREFIX + ' 数据层就绪');

  var STAGES = ['普通', '动摇并越界', '沉沦', '受精怀孕'];

  var renderChip = function (icon, text, extra) {
    var children = [Vue.h('i', { class: 'fa ' + icon })];
    children.push(' ' + text);
    return Vue.h('span', { class: extra ? 'chip ' + extra : 'chip' }, children);
  };

  var renderHeaderBar = function (world, demo) {
    var home = world && world.鸣人状态 === '在家';
    var chips = [
      renderChip('fa-calendar-day', '第' + (world ? world.日期 : 1) + '天'),
      renderChip('fa-clock', world ? world.时间段 : '上午'),
      renderChip('fa-location-dot', world ? world.位置 : '邻居家'),
      renderChip(home ? 'fa-house' : 'fa-briefcase', home ? '鸣人在家' : '鸣人不在家', home ? 'chip-home' : '')
    ];
    if (demo) { chips.push(renderChip('fa-triangle-exclamation', '演示数据', 'chip-demo')); }
    return Vue.h('div', { class: 'header-bar' }, [
      Vue.h('div', { class: 'header-title' }, [
        Vue.h('i', { class: 'fa fa-cat' }),
        Vue.h('span', null, '火影忍者博人传之我是鸣人的邻居')
      ]),
      Vue.h('div', { class: 'header-chips' }, chips)
    ]);
  };

  var renderStatBar = function (label, value, type, icon, iconClass) {
    var v = Math.max(0, Math.min(100, Number(value) || 0));
    return Vue.h('div', { class: 'stat-bar' }, [
      Vue.h('div', { class: 'stat-header' }, [
        Vue.h('div', { class: 'stat-label' }, [
          Vue.h('i', { class: 'fa ' + icon + (iconClass ? ' ' + iconClass : '') }),
          Vue.h('span', null, label)
        ]),
        Vue.h('div', { class: 'stat-value' }, Math.round(v) + ' / 100')
      ]),
      Vue.h('div', { class: 'stat-progress-bg' }, [
        Vue.h('div', { class: 'stat-progress-fill type-' + type, style: { width: v + '%' } })
      ])
    ]);
  };

  var renderStageProgress = function (current) {
    var idx = STAGES.indexOf(current);
    return Vue.h('div', { class: 'stage-progress' }, [
      Vue.h('div', { class: 'stage-dots' }, STAGES.map(function (st, i) {
        var cls = i < idx ? 'completed' : (i === idx ? 'current' : 'future');
        return Vue.h('div', { class: 'stage-dot ' + cls, title: st }, [
          Vue.h('div', { class: 'dot-inner' }),
          Vue.h('span', { class: 'dot-label' }, st)
        ]);
      }))
    ]);
  };

  var renderCycle = function (ovu, day) {
    var d = Math.max(1, Math.min(10, ((Number(day) || 1) - 1) % 10 + 1));
    var pct = Math.min(100, (d / 10) * 100);
    return Vue.h('div', { class: 'cycle-indicator' + (ovu ? ' ovulation' : '') }, [
      Vue.h('div', { class: 'cycle-header' }, [
        Vue.h('div', { class: 'cycle-label' }, [
          Vue.h('i', { class: 'fa ' + (ovu ? 'fa-circle-dot' : 'fa-shield') }),
          Vue.h('span', null, '生理日程')
        ]),
        Vue.h('div', { class: 'cycle-status' }, [
          Vue.h('span', { class: 'status-badge' + (ovu ? ' ovulation' : '') }, ovu ? '排卵日' : '安全日'),
          Vue.h('span', { class: 'cycle-day' }, '第 ' + d + ' / 10 天')
        ])
      ]),
      Vue.h('div', { class: 'cycle-progress-bg' }, [
        Vue.h('div', { class: 'cycle-progress-fill' + (ovu ? ' ovulation' : ''), style: { width: pct + '%' } })
      ])
    ]);
  };

  var App = {
    setup: function () {
      var world = Vue.computed(function () { return dataRef.value ? dataRef.value.世界 : null; });
      var hinata = Vue.computed(function () { return dataRef.value ? dataRef.value.雏田 : null; });
      var stage = Vue.computed(function () { return (hinata.value && hinata.value.关系阶段) || '普通'; });
      var ovu = Vue.computed(function () { return !!(hinata.value && hinata.value.生理日程 === '排卵日'); });
      var day = Vue.computed(function () { return (world.value && world.value.日期) || 1; });
      var demo = Vue.computed(function () { return !hasReal.value; });
      return function () {
        return Vue.h('div', { class: 'status-bar-container' }, [
          renderHeaderBar(world.value, demo.value),
          Vue.h('section', { class: 'panel' }, [
            Vue.h('div', { class: 'panel-title' }, [
              Vue.h('i', { class: 'fa fa-heart' }),
              Vue.h('span', null, '雏田')
            ]),
            Vue.h('div', { class: 'stats-grid' }, [
              renderStatBar('好感度', hinata.value && hinata.value.好感度, 'affection', 'fa-heart', 'icon-heart'),
              renderStatBar('顺从度', hinata.value && hinata.value.顺从度, 'obedience', 'fa-hand', 'icon-hand'),
              renderStatBar('堕落度', hinata.value && hinata.value.堕落度, 'corruption', 'fa-fire', 'icon-fire')
            ])
          ]),
          renderStageProgress(stage.value),
          renderCycle(ovu.value, day.value)
        ]);
      };
    }
  };

  var mountOnce = function () {
    var done = false;
    var go = function () {
      if (done) { return; }
      done = true;
      Vue.createApp(App).mount('body');
      console.info(PREFIX + ' 状态栏已挂载');
    };
    var wait = (typeof waitGlobalInitialized === 'function')
      ? Promise.resolve(waitGlobalInitialized('Mvu')).catch(function () {})
      : Promise.resolve();
    Promise.race([wait, new Promise(function (resolve) { setTimeout(resolve, 3000); })]).then(go);
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', mountOnce);
  } else {
    mountOnce();
  }
  console.info(PREFIX + ' 启动流程完成');
})();
</script>
</head>
<body></body>
</html>
